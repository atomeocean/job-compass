name: require-assignee

# The job itself is the required "Require Assignee Check". Don't create the check via the
# checks API: GitHub attaches API-created check runs to an arbitrary (oldest) check suite on
# the commit, and once a newer run of this workflow supersedes that suite, the PR hides the
# check and the ruleset reports it as "Expected — Waiting for status to be reported".
# Only pull_request events here, so the newest run always carries the current verdict.
on:
  pull_request:
    types: [opened, synchronize, reopened, assigned, unassigned]

permissions:
  pull-requests: read

jobs:
  check-assignee:
    name: Require Assignee Check
    runs-on: ubuntu-latest
    steps:
      - name: Fail if no assignee
        uses: actions/github-script@v7
        with:
          script: |
            // Read live PR state; the event payload can be stale when assign/unassign races.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            if ((pr.assignees || []).length === 0) {
              core.setFailed('This PR must have at least one assignee before it can be merged.');
              return;
            }

            core.info(`Assignee present: ${pr.assignees.map((a) => a.login).join(', ')}`);
