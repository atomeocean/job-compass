# Validate changed JSON using only read access to this repository.
name: Validate JSON Files

on:
  push:
    paths:
      - '**/*.json'
  pull_request:
    paths:
      - '**/*.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate changed JSON files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/changed-json-paths"

          # A newly pushed branch has no previous commit; inspect its full tree.
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git ls-tree -r --name-only -z "$HEAD_SHA" > "$paths_file"
          else
            git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- > "$paths_file"
          fi

          while IFS= read -r -d '' file; do
            [[ "$file" == *.json ]] || continue
            printf 'Validating %s\n' "$file"
            jq empty -- "$file"
          done < "$paths_file"
